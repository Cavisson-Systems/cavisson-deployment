apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cavisson-platform
  namespace: cavisson-tenant1
spec:
  interval: 5m
  timeout: 25m

  install:
    createNamespace: true
    remediation:
      retries: 4

  upgrade:
    remediation:
      retries: 3

  chart:
    spec:
      chart: cavisson-platform
      version: "4.15.0-B111"
      sourceRef:
        kind: HelmRepository
        name: artifact-keeper
        namespace: flux-system

  values:
    controller:
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: 2000m
          memory: 8Gi

    redis:
      persistence:
        enabled: false
        storageClass: standard
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 1Gi

    persistence:
      primary:
        storageClass: standard
        accessMode: ReadWriteOnce

    mongo:
      persistence:
        enabled: true
        storageClass: standard
        accessMode: ReadWriteOnce

    postgres:
      persistence:
        enabled: true
        storageClass: standard
        accessMode: ReadWriteOnce
