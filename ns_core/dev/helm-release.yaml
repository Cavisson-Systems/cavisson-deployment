apiVersion: v1
kind: Namespace
metadata:
  name: cavisson-tenant1

---
apiVersion: v1
kind: Namespace
metadata:
  name: cavisson-operator

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cavisson-platform
  namespace: cavisson-tenant1

spec:
  interval: 5m
  timeout: 25m

  install:
    createNamespace: true
    remediation:
      retries: 4

  upgrade:
    remediation:
      retries: 3

  chart:
    spec:
      chart: cavisson-platform
      version: "4.15.1-B0"
      sourceRef:
        kind: HelmRepository
        name: artifact-keeper
        namespace: flux-system

  values:
    controller:
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: 2000m
          memory: 12Gi

    redis:
      persistence:
        enabled: false
        storageClass: nfs-client
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 1Gi

    persistence:
      primary:
        storageClass: nfs-client
        accessMode: ReadWriteOnce

    mongo:
      persistence:
        enabled: false
        storageClass: nfs-client
        accessMode: ReadWriteOnce

    postgres:
      persistence:
        enabled: true
        storageClass: nfs-client
        accessMode: ReadWriteOnce

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cavisson-operator
  namespace: cavisson-operator

spec:
  interval: 1m
  timeout: 25m

  install:
    createNamespace: true
    crds: CreateReplace

  upgrade:
    crds: CreateReplace

  chart:
    spec:
      chart: cavisson-operator
      version: "4.15.1-B0"

      sourceRef:
        kind: HelmRepository
        name: artifact-keeper-operator
        namespace: flux-system

  values:
    image:
      repository: cloud-build.cav-test.com/cavisson-operator
      tag: "4.15.1.B0"

    imagePullSecrets:
      - name: artifact-keeper-auth
